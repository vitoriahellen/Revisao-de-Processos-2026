        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
          React.createElement("div", {style:{marginBottom:12}},
            React.createElement("label",{style:ss.formLabel},"Código do Documento"),
            React.createElement("input",{style:ss.formInput,value:newProc.doc,onChange:e=>setNewProc({...newProc,doc:e.target.value}),placeholder:"Ex: GS-REQ-055"})
          ),
          React.createElement("div", {style:{marginBottom:12}},
            React.createElement("label",{style:ss.formLabel},"Data Prevista Revisão"),
            React.createElement("input",{type:"date",style:ss.formInput,value:newProc.dataPrev,onChange:e=>setNewProc({...newProc,dataPrev:e.target.value})})
          )
        ),
        React.createElement("div", {style:{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}},
          React.createElement("button",{style:{padding:"8px 20px",fontSize:13,fontWeight:600,border:"1px solid #e2e8f0",borderRadius:6,background:"#fff",color:"#64748b",cursor:"pointer"},onClick:()=>setShowNew(false)},"Cancelar"),
          React.createElement("button",{style:{padding:"8px 20px",fontSize:13,fontWeight:600,border:"none",borderRadius:6,background:"#10b981",color:"#fff",cursor:"pointer"},onClick:saveNew},"Adicionar")
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
